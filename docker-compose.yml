services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: barberia
      POSTGRES_PASSWORD: barberia
      POSTGRES_DB: barberia
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U barberia -d barberia"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
