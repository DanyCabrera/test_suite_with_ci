name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Pruebas unitarias e integración
        working-directory: backend
        run: pytest -q

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar, probar y compilar
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json
      - name: Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          npm ci --prefix frontend
          npm ci --prefix e2e
      - name: Base de datos
        run: docker compose up -d --wait
      - name: Cypress sobre el flujo completo
        env:
          DATABASE_URL: postgresql+psycopg://barberia:barberia@localhost:5432/barberia
          JWT_SECRET: ci-jwt-secret
          SEED_ON_STARTUP: "true"
          CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
          VITE_API_URL: http://localhost:8000
        run: |
          set -euo pipefail
          uvicorn app.main:app --app-dir backend --host 127.0.0.1 --port 8000 > /tmp/api.log 2>&1 &
          npm run dev --prefix frontend -- --host 127.0.0.1 --port 5173 > /tmp/web.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:8000/health >/dev/null && curl -sf http://127.0.0.1:5173 >/dev/null; then
              break
            fi
            sleep 2
          done
          curl -sf http://127.0.0.1:8000/health
          curl -sf http://127.0.0.1:5173 >/dev/null
          npm run cypress:run --prefix e2e

  load:
    name: load
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependencias de la API
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: Base de datos
        run: docker compose up -d --wait
      - name: k6
        run: |
          sudo mkdir -p /etc/apt/keyrings
          curl -fsSL https://dl.k6.io/key.gpg | sudo gpg --dearmor -o /etc/apt/keyrings/k6-archive-keyring.gpg
          echo "deb [signed-by=/etc/apt/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6
      - name: Prueba de carga
        env:
          DATABASE_URL: postgresql+psycopg://barberia:barberia@localhost:5432/barberia
          JWT_SECRET: ci-jwt-secret
          SEED_ON_STARTUP: "true"
          BASE_URL: http://127.0.0.1:8000
        run: |
          set -euo pipefail
          uvicorn app.main:app --app-dir backend --host 127.0.0.1 --port 8000 > /tmp/api.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:8000/health >/dev/null; then
              break
            fi
            sleep 2
          done
          curl -sf http://127.0.0.1:8000/health
          k6 run load/api.js
